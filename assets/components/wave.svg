<svg width="1600" height="200" viewBox="0 0 1600 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="waveTitle waveDesc">
  <title id="waveTitle">Reusable Animated Wave</title>
  <desc id="waveDesc">A blue-gradient wave that scrolls horizontally on a seamless loop, sized to sit at the top of a footer section.</desc>

  <defs>
    <clipPath id="waveClip">
      <rect x="0" y="0" width="1600" height="200"/>
    </clipPath>

    <linearGradient id="waveBlueGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
  </defs>

  <!--
    One wave unit is exactly 1600px (the canvas width) and is drawn twice,
    back to back, then the whole pair is translated by exactly -1600px.
    Because both copies are identical, the loop restart is seamless.
  -->
  <g clip-path="url(#waveClip)">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0,0; -1600,0" dur="16s" repeatCount="indefinite"/>
      <path
        d="M0,90 C400,140 800,40 1600,90 C2000,140 2400,40 3200,90 L3200,200 L0,200 Z"
        fill="url(#waveBlueGradient)"
        opacity="0.55"
      />
    </g>
  </g>
</svg>
