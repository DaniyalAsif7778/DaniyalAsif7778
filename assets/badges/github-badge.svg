<svg width="120" height="48" viewBox="0 0 120 48" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">GitHub Badge</title>
  <desc id="desc">Glass pill badge with a generic branch-node icon, linking out to a GitHub profile.</desc>

  <defs>
    <linearGradient id="pillGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- glass pill -->
  <rect x="0.75" y="0.75" width="118.5" height="46.5" rx="23.25" fill="#111827" fill-opacity="0.65" stroke="url(#pillGradient)" stroke-width="1.5" filter="url(#softGlow)"/>

  <!-- icon -->
  <g transform="translate(16,14)">
      <circle cx="6" cy="4" r="2.1" fill="#F8FAFC"/>
      <circle cx="6" cy="16" r="2.1" fill="#F8FAFC"/>
      <circle cx="15" cy="10" r="2.1" fill="#F8FAFC"/>
      <path d="M6,6.1 L6,13.9" fill="none" stroke="#F8FAFC" stroke-width="1.5"/>
      <path d="M6,11 C6,10.2 6.5,9.6 7.3,9.6 L12.7,9.6 C13.5,9.6 14,9.9 14.4,10.4" fill="none" stroke="#F8FAFC" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- label -->
  <text x="46" y="29" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="600" font-size="15" fill="#F8FAFC">GitHub</text>
</svg>
