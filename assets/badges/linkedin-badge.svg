<svg width="136" height="48" viewBox="0 0 136 48" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">LinkedIn Badge</title>
  <desc id="desc">Glass pill badge with a generic profile icon, linking out to a LinkedIn profile.</desc>

  <defs>
    <linearGradient id="pillGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- glass pill -->
  <rect x="0.75" y="0.75" width="134.5" height="46.5" rx="23.25" fill="#111827" fill-opacity="0.65" stroke="url(#pillGradient)" stroke-width="1.5" filter="url(#softGlow)"/>

  <!-- icon -->
  <g transform="translate(16,14)">
      <circle cx="10" cy="7" r="3.1" fill="#F8FAFC"/>
      <path d="M3.6,17 C3.6,12.6 6.6,10.6 10,10.6 C13.4,10.6 16.4,12.6 16.4,17 Z" fill="#F8FAFC"/>
  </g>

  <!-- label -->
  <text x="46" y="29" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="600" font-size="15" fill="#F8FAFC">LinkedIn</text>
</svg>
