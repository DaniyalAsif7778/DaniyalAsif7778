<svg width="1600" height="500" viewBox="0 0 1600 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="glowTitle glowDesc">
  <title id="glowTitle">Reusable Glow Component Library</title>
  <desc id="glowDesc">Blue and cyan glow gradients and blur filters with opacity-pulse animation, shown as labeled swatches for reuse across the design system.</desc>

  <!--
    HOW TO REUSE: copy whichever <radialGradient>/<linearGradient>/<filter> you need
    from <defs> below into any other SVG in this system. Cross-file references
    (e.g. <use href="glow.svg#glowBlue">) are not reliable once a file is embedded
    via <img> on GitHub, so reuse here means "same recipe, pasted in" rather than
    a live link — that's why every id below is written to be copy-paste ready.
  -->

  <defs>
    <!-- Core glow gradients -->
    <radialGradient id="glowBlue" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.40"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="glowRingGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>

    <!-- Blur filters, three strengths for different use cases -->
    <filter id="glowBlurSoft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glowBlurMedium" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>

    <filter id="glowBlurStrong" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="46"/>
    </filter>

    <style>
      .glow-label { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 13px; letter-spacing: 1px; fill: #94A3B8; }
    </style>
  </defs>

  <!-- neutral dark backdrop so the swatches are legible on their own -->
  <rect width="1600" height="500" fill="#0D1117"/>

  <!-- Swatch 1: glowBlue, ambient strength -->
  <circle cx="280" cy="210" r="150" fill="url(#glowBlue)" filter="url(#glowBlurStrong)">
    <animate attributeName="opacity" values="0.5;0.85;0.5" dur="4s" repeatCount="indefinite"/>
  </circle>
  <text x="280" y="420" text-anchor="middle" class="glow-label">url(#glowBlue)</text>

  <!-- Swatch 2: glowCyan, ambient strength -->
  <circle cx="680" cy="210" r="150" fill="url(#glowCyan)" filter="url(#glowBlurStrong)">
    <animate attributeName="opacity" values="0.45;0.8;0.45" dur="5s" repeatCount="indefinite"/>
  </circle>
  <text x="680" y="420" text-anchor="middle" class="glow-label">url(#glowCyan)</text>

  <!-- Swatch 3: combined blue + cyan, shimmering out of sync -->
  <circle cx="1010" cy="210" r="110" fill="url(#glowBlue)" filter="url(#glowBlurStrong)">
    <animate attributeName="opacity" values="0.35;0.7;0.35" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1110" cy="210" r="110" fill="url(#glowCyan)" filter="url(#glowBlurStrong)">
    <animate attributeName="opacity" values="0.7;0.35;0.7" dur="6s" repeatCount="indefinite"/>
  </circle>
  <text x="1060" y="420" text-anchor="middle" class="glow-label">glowBlue + glowCyan</text>

  <!-- Swatch 4: glow ring, useful behind avatars/badges/status dots -->
  <circle cx="1420" cy="210" r="70" fill="none" stroke="url(#glowRingGradient)" stroke-width="14" filter="url(#glowBlurMedium)">
    <animate attributeName="opacity" values="0.4;0.9;0.4" dur="3.2s" repeatCount="indefinite"/>
  </circle>
  <text x="1420" y="420" text-anchor="middle" class="glow-label">glow-ring</text>
</svg>
