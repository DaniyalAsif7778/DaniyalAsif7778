<svg width="1600" height="500" viewBox="0 0 1600 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="partTitle partDesc">
  <title id="partTitle">Reusable Animated Particle Field</title>
  <desc id="partDesc">20-40 softly glowing particles that drift and fade in a random, endlessly looping pattern. Transparent background, meant to sit on top of another layer.</desc>

  <!-- Two shared gradients keep every particle soft-edged without giving each one its own filter (cheap to render at this count). -->
  <defs>
    <radialGradient id="particleBlue" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="particleCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 30 particles. Each wanders through two random offsets and back (organic, non-linear motion), fading in/out so loop restarts are invisible. No per-particle filters, kept performance-optimized. -->
  <circle cx="1266.6" cy="169.9" r="4.0" fill="url(#particleBlue)" opacity="0"><animate attributeName="opacity" values="0;0.45;0.45;0" dur="13.1s" begin="5.7s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0,0; 70.0,-36.7; 5.0,14.5; 0,0" dur="13.1s" begin="5.7s" repeatCount="indefinite"/></circle>
  <circle cx="456.7" cy="404.3" r="5.0" fill="url(#particleBlue)" opacity="0"><animate attributeName="opacity" values="0;0.66;0.66;0" dur="16.1s" begin="5.0s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0,0; -44.4,-25.0; -37.2,25.1; 0,0" dur="16.1s" begin="5.0s" repeatCount="indefinite"/></circle>
  <circle cx="339.8" cy="108.2" r="3.3" fill="url(#particleBlue)" opacity="0"><animate attributeName="opacity" values="0;0.73;0.73;0" dur="18.8s" begin="5.4s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0,0; 13.3,5.4; -36.0,27.1; 0,0" dur="18.8s" begin="5.4s" repeatCount="indefinite"/></circle>
  <circle cx="350.8" cy="171.3" r="3.4" fill="url(#particleCyan)" opacity="0"><animate attributeName="opacity" values="0;0.82;0.82;0" dur="20.6s" begin="5.5s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0,0; 39.8,66.3; -20.5,11.4; 0,0" dur="20.6s" begin="5.5s" repeatCount="indefinite"/></circle>
